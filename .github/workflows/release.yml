name: Release
on:
  push:
    tags: ["v*"]

# Cada job declara só o que usa.
permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # No nível do job para o `if` do aviso enxergar (env de passo não chega ao `if` do próprio passo).
      # Vazio ou ausente: o .goreleaser.yaml pula o cask e o manifesto Scoop.
      TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...

      - name: Avisar se Homebrew e Scoop vão ficar de fora
        if: env.TAP_GITHUB_TOKEN == ''
        run: echo "::warning::TAP_GITHUB_TOKEN ausente. A release sai sem Homebrew e Scoop (binários e npm seguem)."

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      # O job `npm` precisa dos binários e do artifacts.json do GoReleaser.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  # Job próprio: se o npm falhar, "Re-run failed jobs" refaz só ele (o
  # `release` acima, já concluído, não volta a rodar).
  npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # provenance do npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - run: node --test "npm/**/*.test.mjs" "scripts/*.test.mjs"

      # Antes do npm, que não se desfaz: confere que nomes, checksums e o
      # binário na raiz dos pacotes batem com o que `jatai update` e os
      # instaladores esperam.
      - name: Conferir os pacotes gerados
        run: go test ./internal/update -run 'Goreleaser|BuiltArchives' -count=1
        env:
          JATAI_DIST_DIR: dist

      - name: Publicar no npm
        run: node scripts/npm-packages.mjs --version "${GITHUB_REF_NAME#v}" --publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
