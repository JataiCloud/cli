version: "2"
linters:
  default: standard
  settings:
    staticcheck:
      # ST1005 desligado: as mensagens de erro são texto para a pessoa, em
      # português — começam com maiúscula e terminam com ponto.
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Nos testes e no servidor falso, um erro de preparação não checado
      # aparece na asserção seguinte.
      - path: (_test\.go|cabletest/)
        linters:
          - errcheck
